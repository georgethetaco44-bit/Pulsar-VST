# Pulsar CI — Milestone 2 (SPEC sections 10.2, 13).
#
# 3-OS matrix (ubuntu-22.04 / windows-latest / macos-14): Release + Ninja
# everywhere, vibesynth_cli --smoketest and (M6) --selftest gating the
# build, pluginval at strictness 5 on the VST3, zipped artefacts, and a
# GitHub release on v* tags. Linux also renders every built-in preset to
# WAV (Pulsar-preset-renders; not gating beyond the render succeeding).
#
# Pins: every action is pinned to a verified tag; pluginval is pinned to the
# latest stable release v1.0.4 (v2.x is pre-release only).

name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build + pluginval (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux
            pluginval_asset: pluginval_Linux.zip
          - os: windows-latest
            label: Windows
            pluginval_asset: pluginval_Windows.zip
          - os: macos-14
            label: macOS
            pluginval_asset: pluginval_macOS.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Ninja needs the MSVC environment on PATH for the x64 toolchain.
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Restore CPM dependency cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ github.workspace }}/.cpm-cache
          # Re-hashes whenever the JUCE pin (CMakeLists.txt) or CPM.cmake
          # changes, so a JUCE bump automatically invalidates the cache.
          key: ${{ runner.os }}-cpm-${{ hashFiles('CMakeLists.txt', 'cmake/CPM.cmake') }}
          restore-keys: |
            ${{ runner.os }}-cpm-

      # Exact JUCE dependency set from the dev container (Ubuntu 22.04),
      # plus xvfb for headless pluginval. No cmake: the runner's preinstalled
      # CMake is newer, and apt's 3.22 fails our >= 3.25 minimum. No WebKit.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential git pkg-config ccache \
            libasound2-dev libfreetype6-dev libfontconfig1-dev libx11-dev \
            libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxcomposite-dev libxrender-dev libcurl4-openssl-dev xvfb

      - name: Configure (CMake, Release, Ninja)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCPM_SOURCE_CACHE="${{ github.workspace }}/.cpm-cache" -DVIBESYNTH_COPY_PLUGIN=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      # vibesynth_cli --smoketest exits 1 on any failure, failing the job.
      # It passes only in a real JIT mode (portable is an explicit opt-in).
      # Since M5 it also proves the 1024 loop()/while() cap on this JIT
      # backend, runs every built-in preset through the offline test matrix
      # and checks that every tests/patches/broken_*.pulsar is rejected.
      - name: vibesynth_cli smoketest (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./build/vibesynth_cli --smoketest

      - name: vibesynth_cli smoketest (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ./build/vibesynth_cli.exe --smoketest

      # macOS Universal: prove BOTH slices actually execute JIT code — the
      # native arm64 run, plus the x86_64 slice under Rosetta. Rosetta may
      # not be preinstalled, hence the probe + sudo install step (passwordless
      # sudo is available on GitHub runners). If this install ever stops
      # working, fall back to a macos-13 (Intel) job for the x86_64 slice.
      - name: Prove Universal slices (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          lipo -info build/vibesynth_cli
          lipo -info build/vibesynth_cli | grep -q "x86_64" || { echo "ERROR: x86_64 slice missing in vibesynth_cli"; exit 1; }
          lipo -info build/vibesynth_cli | grep -q "arm64" || { echo "ERROR: arm64 slice missing in vibesynth_cli"; exit 1; }
          arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license

      - name: vibesynth_cli smoketest (macOS arm64)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ./build/vibesynth_cli --smoketest

      - name: vibesynth_cli smoketest (macOS x86_64 via Rosetta)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          arch -x86_64 ./build/vibesynth_cli --smoketest

      # M6 preset gate (SPEC 10.3): every built-in parses, round-trips,
      # passes the offline matrix with its stored trim within 1 dB of the
      # computed one, and builds. Exit 1 on any failure. Never pass
      # --strict-cpu here: on shared runners the per-preset ns are only
      # reported, and CPU gates only through the validator's runaway rule
      # (50 % of real time per configuration, 500 ms deadline; x10 under
      # Rosetta) (SPEC 4.2.1, 7.1).
      - name: vibesynth_cli selftest (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./build/vibesynth_cli --selftest

      - name: vibesynth_cli selftest (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ./build/vibesynth_cli.exe --selftest

      - name: vibesynth_cli selftest (macOS arm64)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ./build/vibesynth_cli --selftest

      - name: vibesynth_cli selftest (macOS x86_64 via Rosetta)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          arch -x86_64 ./build/vibesynth_cli --selftest

      # Every built-in through the plugin's own chain (PatchPlayer) into a
      # 24-bit WAV, for auditioning. Fails only if a render fails.
      - name: Render built-in presets (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p renders
          for f in resources/presets/*.pulsar; do
            name=$(basename "$f" .pulsar)
            ./build/vibesynth_cli --render "$name" "renders/$name.wav"
          done

      - name: Upload Pulsar-preset-renders
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Pulsar-preset-renders
          path: renders/*.wav
          if-no-files-found: error

      # pluginval v1.0.4 is the latest stable release (v2.x is pre-release).
      # Validating the VST3 at strictness level 5 (Linux runs headless under
      # xvfb). Any validation failure fails the job.
      - name: Download pluginval
        shell: bash
        run: |
          curl -L -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/${{ matrix.pluginval_asset }}"
          mkdir -p pluginval-bin
          unzip -o pluginval.zip -d pluginval-bin
          ls -la pluginval-bin

      - name: Validate VST3 with pluginval (Linux, headless)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run -a ./pluginval-bin/pluginval --strictness-level 5 --validate "build/VibeSynthVST_artefacts/Release/VST3/Pulsar.vst3"

      - name: Validate VST3 with pluginval (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ./pluginval-bin/pluginval.exe --strictness-level 5 --validate "build/VibeSynthVST_artefacts/Release/VST3/Pulsar.vst3"

      # Ad-hoc sign so the bundles run on Apple Silicon; this does NOT bypass
      # Gatekeeper (SPEC 10.2 — judges must xattr -cr or "Open Anyway"). Then
      # prove the binaries really are universal before pluginval sees them.
      - name: Ad-hoc codesign + verify Universal binary (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VST3="build/VibeSynthVST_artefacts/Release/VST3/Pulsar.vst3"
          APP="build/VibeSynthVST_artefacts/Release/Standalone/Pulsar.app"
          codesign --force --deep -s - "$VST3" "$APP"
          for BIN in $(find "$VST3" "$APP" -type f \( -name "Pulsar" -o -name "*.so" -o -name "*.dylib" \) -not -path "*/Resources/*"); do
            echo "== $BIN"
            lipo -info "$BIN"
            lipo -info "$BIN" | grep -q "x86_64" || { echo "ERROR: x86_64 slice missing in $BIN"; exit 1; }
            lipo -info "$BIN" | grep -q "arm64" || { echo "ERROR: arm64 slice missing in $BIN"; exit 1; }
          done

      - name: Validate VST3 with pluginval (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ./pluginval-bin/pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate "build/VibeSynthVST_artefacts/Release/VST3/Pulsar.vst3"

      # Package Pulsar-<OS>.zip from the built artefacts.
      - name: Zip VST3 + Standalone (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd build/VibeSynthVST_artefacts/Release
          zip -r -y "$GITHUB_WORKSPACE/Pulsar-${{ matrix.label }}.zip" "VST3/Pulsar.vst3" "Standalone"

      - name: Zip VST3 + Standalone (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "build/VibeSynthVST_artefacts/Release/VST3/Pulsar.vst3", "build/VibeSynthVST_artefacts/Release/Standalone" -DestinationPath "Pulsar-${{ matrix.label }}.zip"

      - name: Upload Pulsar-${{ matrix.label }}.zip
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Pulsar-${{ matrix.label }}
          path: Pulsar-${{ matrix.label }}.zip
          if-no-files-found: error

  # Publishes all three zips as a GitHub release, but only for v* tags.
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all artefacts
        uses: actions/download-artifact@v7.0.0
        with:
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            dist/Pulsar-Linux/Pulsar-Linux.zip
            dist/Pulsar-Windows/Pulsar-Windows.zip
            dist/Pulsar-macOS/Pulsar-macOS.zip

